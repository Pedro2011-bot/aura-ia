version: '3.9'\n\nservices:\n  aura:\n    build: .\n    container_name: aura-ia\n    ports:\n      - \"5000:5000\"\n    environment:\n      - FLASK_ENV=production\n      - AURA_PROVIDER=openai\n      - OPENAI_API_KEY=${OPENAI_API_KEY}\n      - AURA_MODEL=gpt-4\n      - SERVER_PORT=5000\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:5000/api/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3